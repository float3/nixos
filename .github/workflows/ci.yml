name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 6"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux flake checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = false
            experimental-features = nix-command flakes


      - name: Check lock file
        run: nix flake metadata --no-write-lock-file

      - name: Check formatting
        run: nix develop --command alejandra --check .

      - name: Check deploy helpers
        run: |
          nix develop --command taplo fmt --check commands.toml
          nix develop --command rustfmt --check deploy.rs

      # rustfmt only parses; it will happily accept a script that does not
      # compile. deploy.rs is a rust-script with an embedded cargo manifest,
      # so unpack it into a real package and type-check that.
      - name: Type-check deploy.rs
        run: |
          set -euo pipefail
          pkg="$(nix develop --command rust-script --package deploy.rs | tail -1)"
          echo "unpacked to $pkg"
          nix develop --command cargo check --manifest-path "$pkg/Cargo.toml"

      - name: Check flake outputs
        run: nix flake check --no-write-lock-file --print-build-logs

      # Per-host, with an explicit timeout. workstation evaluates far slower
      # than the rest (six hosts finish in about three minutes combined; that
      # one alone exceeds ten), and when the whole step is killed there is no
      # way to tell a slow host from a stuck one. A timeout turns that into a
      # named failure instead of a silent cancellation.
      - name: Evaluate NixOS hosts
        run: |
          set -uo pipefail
          slow=""
          for host in $(nix eval --json .#nixosConfigurations --apply builtins.attrNames | tr -d '[]"' | tr ',' ' ')
          do
            echo "::group::evaluating ${host}"
            start=$(date +%s)
            if timeout 600 nix eval --raw ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath"; then
              echo
              echo "${host}: $(( $(date +%s) - start ))s"
            else
              status=$?
              echo
              echo "${host}: FAILED after $(( $(date +%s) - start ))s (exit ${status})"
              slow="${slow} ${host}"
            fi
            echo "::endgroup::"
          done
          if [ -n "${slow}" ]; then
            echo "hosts that failed or timed out:${slow}"
            exit 1
          fi

      - name: Build Linux Home Manager
        run: nix build .#homeConfigurations.hill.activationPackage --no-link --print-build-logs

  macbook:
    name: MacBook Home Manager
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = false
            experimental-features = nix-command flakes


      - name: Build MacBook Home Manager
        run: nix build .#homeConfigurations.macbook.activationPackage --no-link --print-build-logs
